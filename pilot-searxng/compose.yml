services:
  searxng:
    image: searxng/searxng:latest
    container_name: hermes-pilot-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - "../.pilot-searxng/settings.yml:/etc/searxng/settings.yml:ro"
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
